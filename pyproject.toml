[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hiro-gakumas-hero"
version = "0.2.0"
description = "让大模型稳定玩卡牌养成游戏的工程框架：数据契约、可重放主循环、状态记账与互验、模型无关的 LLM 适配、逐回合复盘页与标注系统"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy", "opencv-python-headless"]

[project.optional-dependencies]
dev = ["pytest"]
# 实机游玩：操作层 / 识别层基于 KAA（kotones-auto-assistant，GPL-3.0），以 git 子模块 vendor/kaa 固定版本引入
play = ["ksaa"]

[tool.uv.sources]
ksaa = { path = "vendor/kaa", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
